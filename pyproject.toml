[build-system]
build-backend = "scikit_build_core.build"
requires = ["scikit-build-core>=0.11", "nanobind>=2.9.2"]

[project]
name = "jzfmm"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "jztree>=1.1.0",
    "jax>=0.8.0",
    "numpy>=2.2.6",
]
description = "GPU-native fast multipole method and differentiable N-body simulations in JAX"
authors = [
    { name="Jens Stücker", email="jens.stuecker@univie.ac.at" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E"]

[project.urls]
Homepage = "https://jstuecker.github.io/jzfmm/"
Repository = "https://github.com/jstuecker/jzfmm"
Issues = "https://github.com/jstuecker/jzfmm/issues"

[tool.scikit-build]
cmake.version = ">=3.24"
build-dir = "build"
logging.level = "INFO"
build.requires = ["jax>=0.8.0", "scikit-build-core>=0.11", "nanobind>=2.9.2", "cmake>=3.24"]
editable.rebuild = false


[project.optional-dependencies]
cuda13 = [
    "jztree[cuda13]>=1.1.0",
    "jax[cuda13]>=0.8.0",
    "nvidia-cuda-cccl>=13.0.0"
]
dev = [
    "ipykernel>=6.30.1",
    "matplotlib>=3.10.6",
    "pytest>=8.4.2",
    "pytest-jax-bench>=0.5.0",
    "jax-ffi-gen>=0.6.1",
    # documentation
    "sphinx",
    "myst-parser",
    "sphinx-paramlinks",
    "sphinx-rtd-theme"
]
build = [
    "scikit-build-core>=0.11",
    "nanobind>=2.9.2",
    "cmake>=3.24"
]
